[tool.uv.workspace]
members = ["pyclaego"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # do not perform function calls in default arguments
    "SIM108", # ternary operator — too opinionated
]
# Per-file ignores for legacy test files and generated code
[tool.ruff.lint.per-file-ignores]
"**/test*/**" = ["B", "SIM"]
"**/tests/**" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — type checking (loose baseline; tighten incrementally)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
# Start with check_untyped_defs so we at least parse every function body
check_untyped_defs = true
# Exclude vendor / generated / migration folders
exclude = [
    "dist/",
    "build/",
    "\\.venv/",
]

# ---------------------------------------------------------------------------
# Pytest — shared baseline; per-member overrides live in member pyproject.toml
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = []

# ---------------------------------------------------------------------------
# Coverage — collected at workspace level with `uv run pytest --cov`
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
parallel = true
source = [
    "pyclaego/src/pyclaego",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
