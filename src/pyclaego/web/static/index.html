<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyClaw-CC Chat</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <!-- EasyMDE Markdown 编辑器样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <!-- Highlight.js 代码高亮样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>💬 会话列表</h2>
            <button id="refresh-sessions-btn" class="btn-icon" title="刷新列表">🔄</button>
        </div>
        <div class="session-list" id="session-list">
            <div class="session-list-loading">加载中...</div>
        </div>
        <div class="sidebar-footer">
            <button id="toggle-sidebar-btn" class="btn-secondary">◀ 隐藏</button>
        </div>
    </div>

    <div class="container">
        <!-- 头部：标题、Session ID 和连接状态 -->
        <div class="header">
            <div class="header-left">
                <button id="show-sidebar-btn" class="btn-icon" title="显示侧边栏">☰</button>
                <h1>🤖 PyClaw-CC 对话</h1>
            </div>
            <div class="session-info">
                <div class="session-input-group">
                    <label for="session-id">Session ID:</label>
                    <input type="text" id="session-id" placeholder="留空自动生成" autocomplete="off">
                    <button id="connect-btn" class="btn-primary">连接</button>
                </div>
                <div class="status-group">
                    <span class="status-label">状态:</span>
                    <span id="status" class="status status-disconnected">未连接</span>
                </div>
            </div>
        </div>

        <!-- 消息展示区 -->
        <div class="chat-messages-container">
            <div id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <h2>👋 欢迎使用 PyClaw-CC</h2>
                    <p>请输入 Session ID 并点击"连接"按钮开始对话</p>
                    <p class="hint">💡 留空 Session ID 将自动生成新会话</p>
                    <p class="hint">📁 点击左侧菜单图标查看历史会话</p>
                </div>
            </div>
            <button id="scroll-bottom-btn" class="btn-scroll-bottom" title="滚动到底部">⬇</button>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <!-- 顶部拖拽缩放手柄 -->
            <div class="input-resize-handle"></div>
            <!-- 附件预览条 -->
            <div id="attach-preview" class="attach-preview" style="display:none;"></div>
            <div class="input-row">
                <button id="attach-btn" class="btn-attach" disabled title="附加图片">🖼️</button>
                <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;">
                <textarea 
                    id="message-input" 
                    placeholder="输入消息... (Cmd+Enter 发送)"
                ></textarea>
                <button id="send-btn" class="btn-send" disabled>
                    <span class="btn-text">发送</span>
                    <span class="btn-icon">📤</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Marked.js Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Highlight.js 代码高亮库 -->
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
    <!-- DOMPurify XSS 防护库 -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- EasyMDE Markdown 编辑器库 -->
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="/static/js/chat.js?v=20260422"></script>
</body>
</html>
