# Session 级配置示例
#
# 用法: 将本文件内容复制到 <session_workspace>/config.yaml
#       Session 初始化时会读取该文件，优先覆盖全局配置中的同名字段。
#
# 覆盖白名单 (通过 get_session_config 合并):
#   agent / context / context_subagents / session_metadata
#
# 非合并字段 (Session.__init__ 直接读取):
#   cron

# ─────────────────────────────────────────────────────────────────────────────
# （可选）覆盖 Agent 策略
# ─────────────────────────────────────────────────────────────────────────────
# agent:
#   type: "simple"
#   llm: "moonshot_kimi"
#   use_tools: true

# ─────────────────────────────────────────────────────────────────────────────
# （可选）覆盖 Context 策略
# ─────────────────────────────────────────────────────────────────────────────
# context:
#   type: "soul_v5"

# ─────────────────────────────────────────────────────────────────────────────
# Cron 定时任务配置
# ─────────────────────────────────────────────────────────────────────────────
cron:
  enabled: true
  timezone: "Asia/Shanghai"   # 时区（支持所有 IANA 时区，如 UTC、America/New_York）

  jobs:
    # ── 示例 1: 每日早报 ─────────────────────────────────────────────────────
    # 每天 08:00 生成一条 HuggingFace 论文摘要，发给在线客户端并写盘。
    - name: morning_paper_brief
      schedule: "0 8 * * *"          # Unix cron 格式：分 时 日 月 周
      prompt: |
        请用中文总结今天 HuggingFace Daily Papers 上关注度最高的 10 篇论文。
        每篇用 3 句话概括：研究问题、方法亮点、主要结论。
        最后附上总体趋势观察（1 段）。
      enabled: true
      output:
        save_to_file: true            # 写入 <workspace>/cron/YYYYMMDD-HHMMSS-morning_paper_brief.md
        broadcast: true               # 推送给当前已订阅的 WebSocket 客户端

    # ── 示例 2: 每小时天气/新闻提醒 ──────────────────────────────────────────
    # 工作时间（09:00–18:00）每整点一次。
    - name: hourly_news_ping
      schedule: "0 9-18 * * 1-5"    # 周一至周五，09:00–18:00 每小时
      prompt: "请简要汇报过去 1 小时内科技领域最值得关注的 1~2 条新闻（来源标注）。"
      enabled: false                  # 默认关闭，按需用 /cron resume hourly_news_ping 开启
      output:
        save_to_file: true
        broadcast: true

    # ── 示例 3: 深夜代码审查提醒 ────────────────────────────────────────────
    # 每天 23:00 提示今日代码变更记录，仅写盘，不广播。
    - name: nightly_code_review_reminder
      schedule: "0 23 * * *"
      prompt: |
        今天工作结束了。请帮我整理一份简短的"代码审查检查清单"提醒，
        涵盖：安全性、可读性、测试覆盖、文档注释四个维度，每项 1 句要点。
      enabled: true
      output:
        save_to_file: true
        broadcast: false              # 仅落盘，不推送（离线时也安静记录）

    # ── 示例 4: 每 5 分钟健康检查（调试用，生产慎用）────────────────────────
    # 用于快速验证 cron 管道是否工作；确认后应 /cron pause 或 enabled: false。
    # - name: debug_heartbeat
    #   schedule: "*/5 * * * *"
    #   prompt: "回复：heartbeat OK"
    #   enabled: false
    #   output:
    #     save_to_file: true
    #     broadcast: true

# ─────────────────────────────────────────────────────────────────────────────
# Cron 字段说明
# ─────────────────────────────────────────────────────────────────────────────
#
# cron.enabled          bool    全局开关，false 时此 session 不启动调度器
# cron.timezone         str     IANA 时区，影响所有 job 的触发时刻
#
# jobs[].name           str     任务名，需唯一（用于 /cron 命令和输出文件名）
# jobs[].schedule       str     标准 5 字段 Unix cron 表达式
#                                 分(0-59) 时(0-23) 日(1-31) 月(1-12) 周(0-7, 0/7=周日)
#                                 支持 */N（每 N 单位）、范围（1-5）、列表（1,3,5）
# jobs[].prompt         str     触发时发给 Agent 的完整提示文本（多行用 | 语法）
# jobs[].enabled        bool    单任务开关；false 时调度器注册时跳过
# jobs[].output.save_to_file  bool  是否写入 <workspace>/cron/YYYYMMDD-HHMMSS-<name>.md
# jobs[].output.broadcast     bool  是否通过 WebSocket 推送给已订阅客户端
#
# /cron 命令（在客户端输入）:
#   /cron list                  列出所有任务及下次触发时间
#   /cron next                  按触发时间排序显示
#   /cron pause  <name>         临时暂停（重启后失效）
#   /cron resume <name>         恢复暂停的任务
#   /cron run    <name>         立即触发一次（不受 schedule 限制）
#   /cron help                  显示帮助
