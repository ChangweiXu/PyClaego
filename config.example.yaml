# PyClaw-CC 配置文件
# 此文件位于项目根目录，作为默认配置

pyclaego:
  version: "1.0.0"                # 配置版本号，便于未来升级和兼容性检查
  root_path: !abs_path "~/.pyclaego"  # 项目根路径，支持 ~/ 展开

# 服务器配置
server:
  host: ${HOST:127.0.0.1}       # 使用环境变量 HOST，默认 127.0.0.1
  port: ${PORT:18765}           # 使用环境变量 PORT，默认 18765
  max_connections: 100          # 最大连接数
  enable_web_server: true       # 是否在 core_server 启动时同步启动 Web API 服务器

# 客户端配置
client:
  server_url: !concat ["ws://", "@{server.host}", ":", "@{server.port}"]  # 自动拼接服务器地址
  reconnect_interval: 3         # 重连间隔（秒）
  timeout: 10                   # 连接超时（秒）

# Web 服务器配置
web:
  host: 0.0.0.0                 # Web 服务器监听地址
  port: 18888                   # Web 服务器端口
  
  # 任务桥接服务器配置（用于 CoreScheduler 和 Web Server 之间的进程间通信）
  task_bridge:
    host: "@{server.host}"      # 桥接服务器监听地址
    port: 18766                 # 桥接服务器端口

# 日志配置
logging:
  level: ${LOG_LEVEL:DEBUG}     # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "text"                # 日志格式: text (普通文本), json (JSON格式)
  log_root: !join_path ["@{pyclaego.root_path}", ".logs"]  # 日志根目录
  file_enabled: true            # 是否启用文件日志
  console_enabled: true         # 是否启用控制台日志
  
  # 日志轮转配置
  rotation:
    type: "time"                # 轮转类型: size (按大小), time (按时间)
    max_bytes: 10485760         # 单个日志文件最大大小（字节，默认10MB）
    backup_count: 5             # 保留的备份文件数量
    when: "midnight"            # 时间轮转周期: midnight (每天午夜), H (每小时), D (每天), W0-W6 (周一到周日)

  # 运行日志配置（RunningLog 类专用）
  # 日志文件命名规则：{log_root}/{subdir}/{name}-YYYYMMDD-run.log
  running_log:
    subdir: "running"                        # 子目录（相对于 log_root），默认 running
    format: "[{time}] [{level}] {message}"   # 行格式模板，支持 {time}/{level}/{message}
    time_format: "%Y-%m-%d %H:%M:%S"         # 时间格式（strftime 格式）
    encoding: "utf-8"                        # 文件编码

# LLM 配置
llm: !include "./.config.d/llm.yaml"  # 从 llm.yaml 文件加载 LLM 配置

# Agent 配置（ Session 中的 Agent 会继承此处配置，并可在 Session 的 config.yaml 中覆盖）
agent:
  type: "spawn"                   # Agent 策略类型：spawn
  llm: "@{llm.default_provider}"
  use_tools: true                 # 是否启用工具调用（simple/spawn 有效）

  simple:
    max_tool_rounds: 55           # 最大循环次数

  spawn:
    max_tool_rounds: 55           # 最大循环次数（继承自 simple）
    max_concurrent_subagents: 5   # 最大并发子 Agent 数（SpawnAgent 专用，0 表示禁用）

  # 子 Agent 配置（由 SpawnAgent 通过 spawn_subagent 工具传递给子 Agent）
  # subagent_type 对应 SUBAGENT_REGISTRY 中的键名
  subagents:
    info_gatherer:
      max_tool_rounds: 20         # InfoGathererSubAgent 最大工具循环轮次

    code_explorer:
      max_tool_rounds: 30         # CodeExplorerSubAgent 最大工具循环轮次

# Context 配置（ Session 中的 Context 会继承此处配置，并可在 Session 的 config.yaml 中覆盖）
context:
  type: "soul_v6"                 # Context 策略类型：soul_v5, soul_v6

  soul_v5:
    keep_groups: 10              # 保留最近 N 组对话用于 LLM 上下文

  soul_v6:
    keep_groups: 10                        # 与 V5 兼容；用于回退路径

    # ── Phase 2: 工具结果生命周期 ────────────────────────────────
    tool_result_store:
      spill_token_threshold: 2000          # 超过此 token 数的工具输出会落盘
      head_chars: 600                      # 占位符头部预览字符数
      tail_chars: 200                      # 占位符尾部预览字符数

    stale_evictor:
      keep_recent_turns: 2                 # 最近 N 轮的 tool_result 永远保留
      summarize_tokens_threshold: 1000     # 超过此值 → 改写为 summary
      drop_tokens_threshold: 4000          # 超过此值 → 直接 DROP
      head_chars_summary: 400              # 改写时保留的头部字符数

    # ── Phase 3: 轮摘要 + open loops ────────────────────────────
    turn_brief:
      wait_timeout_s: 0.5                  # 下一轮开始时等待 brief 的最长秒数
      verbatim_recent_groups: 3            # 最近 N 组保留逐字消息
      max_older_groups: 30                 # 更早组以摘要形式注入的上限
      min_chars_for_llm: 200               # 短于此长度的 turn 跳过 LLM brief

    open_loops:
      token_budget: 600                    # 注入 system prompt 的 token 上限

    # ── Phase 5: 实体卡片 + 写前审查 ────────────────────────────
    entity_cards:
      token_budget: 800                    # 实体卡片注入的 token 上限
      top_k: 8                             # 最多注入的卡片数

    write_review:
      enabled: true
      block_threshold: 0.85                # ≥ 此分数 → BLOCK_PENDING（让 LLM 决策）
      link_threshold: 0.50                 # ≥ 此分数 → ALLOW_WITH_LINK（自动加引用）
      max_candidates: 8                    # 写前查询的候选最大数

# 全局共享：磁盘、LLM、token 编码模型、压缩与召回策略
context_global:
  soul_v5_memory:
    # 文件树根目录（MD 文件 + SQLite DB）
    md_root: !join_path ["@{pyclaego.root_path}", ".memory", "soul_v5"]
    # 索引数据库路径（默认在 md_root/_index.db）
    db_path: !join_path ["@{pyclaego.root_path}", ".memory", "soul_v5", "_index.db"]
    
    # 压缩/摘要用 LLM（Phase 4 启用后使用）
    llm_id: "@{llm.default_provider}"
    
    # tiktoken 编码模型（用于 token 计数）
    tiktoken_model: "gpt-5"
    
    # Token 预算
    token_budget:
      context_window_cap: 65536   # 上下文窗口总容量
      preference_cap: 2000        # 偏好文件 token 上限
      experience_inject_cap: 8000 # experience 注入上限
      topic_index_cap: 1500       # topic 索引注入上限
      # ↓ 新增：加载历史时截断过长的工具输出
      tool_content_truncation_threshold: 2000  # 超过此 token 数的工具输出将被截断
      tool_content_head_chars: 1000            # 保留头部字符数
      tool_content_tail_chars: 500             # 保留尾部字符数
    
    # 自动压缩阈值（Phase 4 启用后生效）
    compression:
      auto_group_threshold: 8     # 未索引 group 数达此值时触发自动压缩
      group_compress_stop_at: 4   # 压缩 while 循环的退出条件（remaining < 此值时停止；默认为触发阈值的一半）
      auto_case_threshold: 4      # 某 topic 下未索引 case 数达此阈值后触发 experience 提炼
      max_exps_per_topic: 5       # 每个 topic 下活跃 experience 的上限（LLM 须合并/废弃超出部分）
      cluster_token_budget: 12000 # 单次 synthesize_case 调用的 token 预算（贪婪装入 group 直到超限）

    # 自动记忆召回（每轮对话开始时，根据用户消息自动检索相关记忆注入系统提示）
    memory_recall:
      enabled: true
      token_budget: 4000            # 召回内容的 token 预算
      methods:
        jieba_kw_extr:
          top_k: 5                  # jieba 提取关键词数量
        fts_recall:
          top_k: 15                 # FTS5 过量检索候选数
          fts_threshold: -5.0       # FTS5 BM25 rank 过滤阈值（越接近 0 越相关）
          priority_order:           # doc_type 加载优先级
            - experience
            - case
        llm_rerank:
          enabled: false            # MVP 阶段默认关闭
          llm_id: ""                # 留空则使用 memory 的默认 llm_id
          top_k: 5                  # rerank 后保留数量
      workflow:                     # 激活的处理步骤（按顺序执行）
        - jieba_kw_extr
        - fts_recall

  soul_v6_memory:
    md_root: !join_path ["@{pyclaego.root_path}", ".memory", "soul_v6"]
    db_path: !join_path ["@{pyclaego.root_path}", ".memory", "soul_v6", "_index.db"]

    llm_id: "@{llm.default_provider}"     # 用于 brief 合成等内部 LLM 调用
    tiktoken_model: "gpt-5"

    token_budget:
      context_window_cap: 131072          # 目标模型上下文窗口
      preference_cap: 2000
      experience_inject_cap: 8000
      topic_index_cap: 1500
      tool_content_truncation_threshold: 2000
      tool_content_head_chars: 1000
      tool_content_tail_chars: 500

    compression:
      auto_group_threshold: 8
      group_compress_stop_at: 4
      auto_case_threshold: 4
      max_exps_per_topic: 5
      cluster_token_budget: 12000

    memory_recall:
      enabled: true
      token_budget: 4000
      methods:
        jieba_kw_extr: { top_k: 5 }
        fts_recall:
          top_k: 15
          fts_threshold: -5.0
          priority_order: [experience, case]
        llm_rerank:
          enabled: false
          llm_id: ""
          top_k: 5
      workflow:
        - jieba_kw_extr
        - fts_recall

# 子 Agent 的上下文配置，与 context 合并后传入子 Agent 上下文初始化
# ( Session 中的子 Agent 会继承此处配置，并可在 Session 的 config.yaml 中覆盖)
context_subagents:
  # 子 Agent 上下文类型：由 SpawnAgent 按 subagent_type 自动选择
  #   info_gatherer, code_explorer
  type: "info_gatherer"

  info_gatherer:
    # 上下文压缩配置（防止长对话消息列表膨胀）
    compress:
      tool_output_max_tokens: 3000    # 单次工具输出最大 token 数，超过则截断保留头尾
      tool_output_keep_head: 2000     # 截断时保留开头 token 数
      tool_output_keep_tail: 500      # 截断时保留结尾 token 数
      context_token_budget: 50000     # 消息列表总 token 预算，超过时压缩旧轮次
      keep_recent_rounds: 3           # 压缩时豁免最近 N 轮的工具输出

# Session 元数据（可在每个 Session 的 config.yaml 中覆盖）
session_metadata:
  # 代码探索子 Agent 使用的项目根目录（绝对路径或相对于 CWD）
  project_root: "./"

# Session 配置
session:
  workspace_root: !join_path ["@{pyclaego.root_path}", "workspaces"]  # 默认工作空间根目录（支持 ~/ 展开）
  auto_save_interval: 60                               # 自动保存间隔（秒）
  
  # Session 工作目录自定义映射 (可选)
  # 键: session_id, 值: 该 Session 的完整工作目录路径
  # 如果未配置,使用 workspace_root / session_id
  session_workspace_root:
    # 示例: 为特定 Session 指定独立路径
    # test_session_001: !join_path ["@{pyclaego.root_path}", "custom", "workspaces", "test_001"]
    # prod_session_abc: !join_path ["@{pyclaego.root_path}", "production", "sessions", "abc"]
    # example: !join_path ["@{pyclaego.root_path}", "workspaces", "my_session"]

# 技能配置
skill:
  # 全局共享技能目录列表（按优先级从低到高排列，后者优先级更高）
  # 支持 ~/ 路径展开和 !join_path 标签
  directories:
    - !join_path ["@{pyclaego.root_path}", "skills", "builtin"]   # 内置技能目录（随项目发布）
    # - !join_path ["@{pyclaego.root_path}", "skills", "custom"]  # 用户自定义全局技能目录（可选）
  
  # 内容缓存（避免重复读取磁盘，建议生产环境开启）
  cache_enabled: true
  
  # 技能默认启用状态
  # 若某个技能的 SKILL.md frontmatter 未声明 metadata.enabled 字段，则使用此默认值
  default_enabled: true

# 注意：Session 独有技能无需在此配置，系统会自动从以下路径加载：
#   - session.session_workspace_root.<session_id>/skills/  （如有自定义映射）
#   - session.workspace_root/<session_id>/skills/           （默认推断路径）

# 工具配置
tools: !include "./.config.d/tools.yaml"  # 从 tools.yaml 文件加载工具配置

# 安全配置
security: !include "./.config.d/security.yaml"  # 从 security.yaml 文件加载安全规则配置

# ================================================================
# 飞书集成配置
# 使用飞书开放平台自建应用接入，需在开发者后台开启机器人能力并配置权限
# 参考文档: https://open.feishu.cn/document/server-docs/im-v1/message/create
# ================================================================
feishu:
  # 应用凭证（必填）
  # 在飞书开放平台 https://open.feishu.cn/app 创建自建应用后获取
  app_id: ${FEISHU_APP_ID:}               # 飞书应用 App ID，格式如 cli_xxxxxxxxxxxx
  app_secret: ${FEISHU_APP_SECRET:}       # 飞书应用 App Secret

  # 事件订阅安全配置（使用 WebSocket 长连接时可留空，Webhook 模式下必填）
  encrypt_key: ${FEISHU_ENCRYPT_KEY:}                       # 事件加密 Key（可选）
  verification_token: ${FEISHU_VERIFICATION_TOKEN:}         # 验证 Token（可选）

  # 机器人自身的 open_id（用于过滤机器人自身发送的消息，防止循环回复）
  # 获取方式: 在飞书开发者后台 > 凭证与基础信息 > 机器人信息中查看
  bot_user_id: ${FEISHU_BOT_OPEN_ID:}

  # 消息去重缓存大小（LRU），防止飞书平台重复推送事件导致重复处理
  dedupe_cache_size: 1000

  # 默认回复消息类型
  # - "text": 纯文本（默认）
  # - "rich_text": 富文本（按换行拆分为多行，保留段落结构）
  default_reply_type: "text"

  # Session ↔ 飞书 ID 持久化缓存文件路径
  # 用于进程重启后恢复 session_key → (open_id/chat_id) 映射，并在启动时预连接已知 session
  # 设置后，每次新 feishu session 激活时会自动原子写入此文件
  existing_session_cache: !join_path ["@{pyclaego.root_path}", ".cache", ".feishu_sessions.json"]

  # WebSocket 长连接保活配置（向 CoreScheduler 的持久 ws）
  ws_ping_interval: 30        # 空闲时发送 ping 的间隔（秒）
  ws_ping_timeout: 10         # 等待 pong 响应的超时（秒），超时后视为断连
  ws_reconnect_delay: 5       # ws 断开后等待多少秒再尝试重连（秒）
