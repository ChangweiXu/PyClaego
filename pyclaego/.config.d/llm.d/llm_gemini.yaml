# ── Gemini OpenAI-compatible (直连) ─────────────────────────────────────────
# 通过 Gemini 官方 OpenAI 兼容端点调用，支持 reasoning_effort 思考控制
# base_url: https://generativelanguage.googleapis.com/v1beta/openai

gmn3_1p_oai:  # Gemini 3.1 Pro Preview → OpenAI 兼容端点
  # Input:  $ 2($ 4)/1m tokens. (> 200k tokens context)
  # Output: $12($18)/1m tokens. (> 200k tokens context)
  api: "gemini_openai"           # Gemini OpenAI 兼容端点 + thought_signature 往返
  api_key: ${GEMINI_API_KEY:}
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-3.1-pro-preview"
  temperature: 1.0
  max_tokens: 16384
  max_context_tokens: 960000
  reasoning_effort: "high"       # thinking_level: high (默认动态思考)

