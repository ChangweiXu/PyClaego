
or_gpt5_5:  # OpenRouter GPT-5.5 模型配置示例
  api: "openai"                  # API 类型: openai, anthropic, gemini
  api_key: ${OPEN_ROUTER_API_KEY:}
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-5.5"
  temperature: 1.0
  max_tokens: 32772
  max_context_tokens: 960000
  extra_body:
    reasoning:
      enabled: true

