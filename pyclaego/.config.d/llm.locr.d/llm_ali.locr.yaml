# 本地 LLM Router 代理 — 阿里百炼 / DashScope 系列模型
#
# 这些 provider 将请求发送到本地 llm_router（http://127.0.0.1:18790/v1），
# 由 router 根据 model 字段匹配上游并转发。
# model 值必须与 llm_router.yaml 中对应 upstream 的 alias 完全一致。

locr_ali_qwen3_6plus:  # 阿里百炼 Qwen3-6Plus → 本地代理
  api: "deepseek"
  api_key: "local_router_no_key_needed"
  base_url: "http://127.0.0.1:18790/v1"
  model: "ali_qwen3_6plus"         # llm_router.yaml alibl upstream alias
  temperature: 1.0
  max_tokens: 25600
  max_context_tokens: 960000

locr_ali_glm5:  # 阿里百炼 GLM-5 → 本地代理
  api: "openai"
  api_key: "local_router_no_key_needed"
  base_url: "http://127.0.0.1:18790/v1"
  model: "ali_glm5"                # llm_router.yaml alibl upstream alias
  temperature: 1.0
  max_tokens: 32000
  max_context_tokens: 202745

locr_ali_qwen3_6plus_ant:  # 阿里百炼 Qwen3-6Plus Anthropic → 本地代理
  api: "anthropic"
  api_key: "local_router_no_key_needed"
  base_url: "http://127.0.0.1:18790"
  model: "ali_qwen3_6plus_ant"     # llm_router.yaml alibl-ant upstream alias
  temperature: 1.0
  max_tokens: 25600
  max_context_tokens: 960000

locr_ali_glm5_ant:  # 阿里百炼 GLM-5 Anthropic → 本地代理
  api: "anthropic"
  api_key: "local_router_no_key_needed"
  base_url: "http://127.0.0.1:18790"
  model: "ali_glm5_ant"            # llm_router.yaml alibl-ant upstream alias
  temperature: 1.0
  max_tokens: 32000
  max_context_tokens: 202745

