[project]
name = "pyclaego"
version = "2.0.0"
description = "PyClaego: a session-based agent framework with WebSocket scheduler, cron tasks, and pluggable context handlers"
authors = [
    { name = "pyclaego contributors" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "websockets>=13.0,<16.0",
    "PyYAML>=6.0.1,<7.0.0",
    "openai>=2.30.0,<3.0.0",
    "anthropic>=0.89.0,<1.0.0",
    "google-genai>=1.72.0,<2.0.0",
    "aiohttp>=3.13.5,<4.0.0",
    "httpx[http2]>=0.28.1,<1.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "jieba>=0.42.1",
    "lark-oapi>=1.3.0,<2.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "filelock>=3.25.2,<4.0.0",
    "apscheduler>=3.10,<4",
    "tiktoken>=0.11.0",
    "aiosqlite>=0.20.0",
    "PyPDF2>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.47.0,<9.0.0",
]
pdf = [
    "pdfplumber>=0.10.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
    "ruff>=0.9",
]

[project.scripts]
pyclaego-core       = "pyclaego.cli.core:main"
pyclaego-web        = "pyclaego.cli.web:main"
pyclaego-tui        = "pyclaego.cli.tui:main"
pyclaego-feishu     = "pyclaego.cli.feishu:main"
pyclaego-tui-ps     = "pyclaego.cli.tui_ps:main"
pyclaego-llm-router = "pyclaego.cli.llm_router:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyclaego"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/pyclaego"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

